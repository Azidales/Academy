<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Flow - Renato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.52.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slate-50 text-slate-900 pb-24 md:pb-10">

    <div id="loader" role="status" aria-live="polite" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Sincronizando Cloud...</p>
    </div>

    <div class="max-w-6xl mx-auto px-4 pt-6 md:pt-12">
        <header class="flex justify-between items-center mb-8 md:mb-12">
            <div>
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tighter italic uppercase text-slate-900 leading-none">Academic<span class="text-blue-600">Flow</span></h1>
                <p class="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Dashboard • Renato</p>
            </div>
            <div class="h-10 w-10 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg">
                <i data-lucide="user" class="w-5 h-5"></i>
            </div>
        </header>

        <div class="desktop-grid">
            <div class="space-y-8">
                <section id="tab-summary" class="tab-content tab-active">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="w-3 h-3"></i> Faltas Acumuladas
                    </h2>
                    <div id="summary-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                </section>

                <section id="tab-calendar" class="tab-content">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="calendar" class="w-3 h-3"></i> Calendário
                    </h2>
                    <div class="bg-white p-6 rounded-[2rem] shadow-xl shadow-slate-200/50 border border-white">
                        <div class="flex justify-between items-center mb-8">
                            <h3 id="monthDisplay" class="font-extrabold text-xl text-slate-800"></h3>
                            <div class="flex gap-2">
                                <button type="button" aria-label="Mês anterior" onclick="changeMonth(-1)" class="p-2 hover:bg-slate-50 rounded-xl transition text-slate-400"><i data-lucide="chevron-left"></i></button>
                                <button type="button" aria-label="Próximo mês" onclick="changeMonth(1)" class="p-2 hover:bg-slate-50 rounded-xl transition text-slate-400"><i data-lucide="chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="calendar-grid text-center text-[10px] font-black text-slate-300 mb-4 uppercase">
                            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                        </div>
                        <div id="calendarDays" class="calendar-grid gap-2"></div>
                    </div>
                </section>

                <section id="tab-agenda" class="tab-content">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="calendar-clock" class="w-3 h-3"></i> Próximos Eventos
                    </h2>
                    <div id="agenda-container" class="space-y-3"></div>
                </section>
            </div>

            <aside id="tab-today" class="tab-content mt-8 md:mt-0">
                <div class="sticky top-12">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="info" class="w-3 h-3"></i> Registro de Presença
                    </h2>
                    <div id="dayDetails" class="bg-white/70 backdrop-blur-xl p-6 rounded-[2rem] border border-white shadow-xl min-h-[300px]">
                        <div id="dayBody">
                            <div class="flex flex-col items-center justify-center py-20 text-center opacity-30">
                                <i data-lucide="mouse-pointer-click" class="w-12 h-12 mb-4"></i>
                                <p class="text-xs font-bold uppercase tracking-widest">Selecione uma data</p>
                            </div>
                        </div>
                        <div id="dayForm" class="hidden mt-5 pt-5 border-t border-slate-100">
                            <button type="button" id="evtToggle" onclick="window.toggleEvtForm()" class="w-full py-2.5 rounded-xl text-[9px] font-extrabold border border-dashed border-slate-200 text-slate-400 transition hover:border-blue-200 hover:text-blue-600">+ EVENTO</button>
                            <div id="evtFields" class="hidden space-y-2 mt-2">
                                <div class="grid grid-cols-2 gap-1">
                                    <button type="button" id="evtTypeProva" onclick="window.setEvtType('prova')" class="py-2.5 rounded-xl text-[9px] font-extrabold border transition">PROVA</button>
                                    <button type="button" id="evtTypeTrabalho" onclick="window.setEvtType('trabalho')" class="py-2.5 rounded-xl text-[9px] font-extrabold border transition">TRABALHO</button>
                                </div>
                                <div class="relative">
                                    <select id="evtSubject" class="w-full appearance-none pl-4 pr-9 py-2.5 rounded-xl border border-slate-100 bg-white text-xs font-bold text-slate-700 outline-none focus:border-blue-200 cursor-pointer"></select>
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none flex"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></span>
                                </div>
                                <input id="evtDesc" type="text" maxlength="80" placeholder="Descrição (opcional)" onkeydown="if(event.key==='Enter') window.addEvent()" class="w-full px-4 py-2.5 rounded-xl border border-slate-100 bg-white text-xs font-bold text-slate-700 placeholder:text-slate-300 placeholder:font-normal outline-none focus:border-blue-200">
                                <button type="button" id="evtAdd" onclick="window.addEvent()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white text-[9px] font-extrabold transition">ADICIONAR</button>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Menu claro com borda sutil -->
    <nav class="mobile-nav fixed bottom-6 left-6 right-6 bg-white/90 backdrop-blur-md rounded-full px-8 py-4 flex justify-between items-center z-40 shadow-xl shadow-slate-200/80 border border-slate-100">
        <button type="button" aria-label="Resumo" onclick="switchTab('summary', this)" class="flex flex-col items-center gap-1 text-slate-300 nav-active">
            <i data-lucide="layout-grid" class="w-5 h-5"></i>
        </button>
        <button type="button" aria-label="Calendário" onclick="switchTab('calendar', this)" class="flex flex-col items-center gap-1 text-slate-300">
            <i data-lucide="calendar" class="w-5 h-5"></i>
        </button>
        <button type="button" aria-label="Agenda" onclick="switchTab('agenda', this)" class="flex flex-col items-center gap-1 text-slate-300">
            <i data-lucide="calendar-clock" class="w-5 h-5"></i>
        </button>
        <button type="button" aria-label="Registro de presença" id="todayBtn" onclick="switchTab('today', this)" class="flex flex-col items-center gap-1 text-slate-300">
            <i data-lucide="check-square" class="w-5 h-5"></i>
        </button>
    </nav>

        <script type="module" src="./app.js"></script>
</body>
</html>
