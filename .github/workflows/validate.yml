name: Validate Academic Flow

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-logic.js

      - name: Run logic tests
        run: node --test tests/*.test.mjs

      - name: Check required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f app-logic.js
